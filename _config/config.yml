---
Name: toastnz-colourpalettes
---

Toast\ColourPalettes\Models\Colour:
  colour_groups:
    # - Products
  default_colours:
    # - primary: null
    # - secondary: null
    # - white: 'ffffff'
    # - black: '000000'
    # - off-white: null
    # - off-black: null
  theme_colours:
    # - primary
    # - secondary
  contrast_colours:
    - on-dark: '#ffffff'
    - on-light: '#000000'

SilverStripe\SiteConfig\SiteConfig:
  # Folder inside the public folder the generated CSS is written to.
  # Set css_folder_path (relative to the base folder) instead to write it elsewhere.
  css_folder: 'assets/styles'
  # Inline the theme CSS on every page, set to false to link the file instead
  inline_theme_css: true
  extensions:
    - Toast\ColourPalettes\Extensions\SiteConfigColourExtension

PageController:
  extensions:
    - Toast\ColourPalettes\Extensions\PageControllerExtension

SilverStripe\Control\Controller:
  extensions:
    - Toast\ColourPalettes\Extensions\ControllerExtension
